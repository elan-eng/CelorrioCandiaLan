<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Crealia</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo">
        </a> 

        <nav>
            <!-- Enlaces de navegacion -->
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./register.html">Register</a></li>
            </ul>

            <!-- Barra de busqueda -->
            <form action="./product.html" method="get" class="busqueda">
                <div>
                    <input id="busqueda" type="text" name="buscar" value="" placeholder="Encontra lo que necesites">
                    <button type="submit">Buscar</button>
                </div>
            </form>
        </nav> 
    </header>

    <main class="form">
        <h1>Bienvenido devuelta &#9825</h1>
        <p>Por favor ingresa sus datos personales para iniciar sesión</p>

        <form action="index.html" method="GET">
            <div>
                <input type="email" name="email" value="" placeholder="Email" required>
            </div>
            <div>
                <input type="text" name="pass" value="" placeholder="Contraseña" required>
            </div>
            <div>
                <button type="submit">Iniciar sesión</button>
            </div>

            <div>
                ¿Todavia no tenes tu cuenta? <a href="./register.html">Registrate aquí</a>
            </div>
        </form>
    </main>

    <footer>
        <p>Equipo: Celorrio, Candia, Lan</p>
    </footer>
</body>
</html>
