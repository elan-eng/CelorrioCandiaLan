<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Crealia</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo">
        </a> 
        <nav>
            <a href="./index.html">Home</a> 
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>  
        </nav> 
    </header>

    <main class="form">
        <h1>Bienvenido devuelta &#9825</h1>
        <p>Por favor ingresa sus datos personales para iniciar sesión</p>

        <form action="index.html" method="GET">
            <div>
                <input type="email" name="email" value="" placeholder="Email">
            </div>
            <div>
                <input type="text" name="pass" value="" placeholder="Contraseña">
            </div>
            <div>
                <button type="submit">Iniciar sesión</button>
            </div>

            <div>
                ¿Todavia no tenes tu cuenta? <a href="./register.html">Registrate aquí</a>
            </div>
            <div>
                <input type="radio" name="recordarpass" value="yes">
                <label for=""recordarpass>Recordarme</label>
            </div>            
        </form>
    </main>

    <footer>
        <p>Equipo: Celorrio, Candia, Lan</p>
    </footer>
</body>
</html>
