<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Crealia</title>
    <link rel="stylesheet" href="./css/styles.css">

</head>
<body>
    <header>
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo">
        </a> 
       <nav>
            <a href="./index.html">Home</a> 
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>  
        </nav> 
    </header>

    <main class="form">
        <h1>Bienvenido a Crealia &#9734</h1>
        <p>Por favor ingresa sus datos personales para registrarse</p>

        <form action="index.html" method="GET">
            <div>
                <input type="text" name="nom" value="" placeholder="Nombre" required>
            </div>
            <div>
                <input type="text" name="sur" value="" placeholder="Apellido" required>
            </div>
            <div>
                <input type="email" name="email" value="" placeholder="Email" required>
            </div>
            <div>
                <input type="password" name="pass" value="" placeholder="Contraseña" required>
            </div>
            <div>
                <button type="submit">Crear cuenta</button>
            </div>

            <div>
                ¿Ya tenes tu cuenta? <a href="./login.html">Inicie sesión aquí</a>
            </div>        
        </form>
    </main>

    <footer>
        <p>Equipo: Celorrio, Candia, Lan</p>
    </footer>
</body>
</html>
